databases:
  - name: milk-tracking-db
    databaseName: milk_tracking
    user: milktrack
    plan: free

services:
  - type: web
    name: milk-tracking-api
    runtime: docker
    plan: free
    rootDir: api
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: milk-tracking-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"

  - type: web
    name: milk-tracking-agent
    runtime: docker
    plan: free
    rootDir: agent
    dockerfilePath: ./agent/Dockerfile
    dockerContext: ./agent
    autoDeploy: true
    envVars:
      - key: API_BASE_URL
        value: https://milk-tracking-api.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: API_EMAIL
        sync: false
      - key: API_PASSWORD
        sync: false
